<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selectors</title>
  <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
  <script>

    $(document).ready(function () {
      $('#paragraph').css('color', 'blue')
      $('.example').css('font-weight', 'bold')
      $('button').click(function () {
        alert('Button was Clicked')
      })
      $('input[type="text"]').val("Default value")
      $('input[type="email"]').val("your-email@example.com")
    })
  </script>
</head>

<body>
  <p id="paragraph">This text will be blue.</p>
  <p class="example">This text will be bold</p>
  <button>Click Me</button>
  <input type="text" name="exampleInput" />
  <input type="email" />
</body>

</html>
