<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    .header {
      grid-area: header;
      background-color: #F3E5F5;
      /* padding: 30px; */
      /* text-align: center; */
      /* font-size: 25px; */
      height: 60px;
      display: flex;
      align-items: center;
      flex-direction: column;
      justify-content: center;
    }

    .header nav {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .header nav a {
      text-decoration: none;
      padding: 10px 20px;
    }

    .header nav a:hover {
      background-color: #E1BEE7;
    }

    .grid-continer {
      display: grid;
      grid-template-areas:
        'header header header header header header header'
        'left middle middle middle middle middle middle'
        'footer footer footer footer footer footer footer';
    }


    .left,
    .middle,
    .right {
      padding: 10px;
      height: 300px;
    }

    .left {
      grid-area: left;
      background-color: #4DB6AC;
      padding: 0;
    }

    .middle {
      grid-area: middle;
      background-color: #FFCCBC;
    }

    .right {
      grid-area: right;
      background-color: #F4FF81;
    }

    .footer {
      grid-area: footer;
      background-color: #E8F5E9;
      padding: 10px;
      text-align: center;
    }

    .navbar {
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .navbar a {
      text-decoration: none;
      color: white;
      padding: 10px;
    }

    .navbar a:hover {
      background-color: blue;
    }
  </style>
  <script></script>
</head>

<body>

  <div class="grid-continer">
    <div class="header">
      <nav>
        <a href="#">Top Link 1</a>
        <a href="#">Top Link 2</a>
        <a href="#">Top Link 2</a>
      </nav>
    </div>

    <div class="left">
      <div class="navbar">
        <a href="#">Link 1</a>
        <a href="#">Link 2</a>
        <a href="#">Link 3</a>
      </div>
    </div>
    <div class="middle">Middle Column</div>
    <!-- <div class="right">Right Column</div> -->

    <div class="footer">
      <p>footer</p>
    </div>
  </div>
  <script>
    alert("Hello JavaScript")
  </script>
</body>

</html>
