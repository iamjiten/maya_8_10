<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>

  <script>
    var grade = 'A';

    switch (grade) {
      case 'A':
        document.write("Good Job");
        break;
      case 'B':
        document.write("Pretty Job");
        break
      case 'C':
        document.write('Passed');
        break;
      case 'D':
        document.write('Not so good');
        break;
      case 'E':
        document.write('Failed');
        break;
      default:
        document.write('Invalid grade');
        break;
    }

  </script>

</body>

</html>
